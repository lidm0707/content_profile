# Edge router: static UI + /api -> content_backend axum server.
# envsubst template (compose envs baked at container start).

# 127.0.0.11 = Docker's embedded DNS. Using a resolver + variable
# proxy_pass forces per-request name resolution, so recreated
# containers (new IPs) don't leave nginx pointing at a dead upstream.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        set $ui_upstream http://ui_wasm;
        proxy_pass $ui_upstream;
        proxy_set_header Host $host;
    }
}
