name: content_profile_backend

services:
  nginx:
    image: nginx:alpine
    ports:
      - "6191:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ui_wasm
      - backend
    networks:
      - content_net

  ui_wasm:
    build:
      context: ../..
      dockerfile: docker/ui_have_backend/ui.Dockerfile
    expose:
      - "80"
    networks:
      - content_net

  backend:
    build:
      context: ../..
      dockerfile: docker/ui_have_backend/backend.Dockerfile
    env_file:
      - ../../.env
    environment:
      BACKEND_MODE: ${BACKEND_MODE:-pg_sync}
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: ${DATABASE_URL:-postgres://content:content@db:5432/content}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - content_net

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-content}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-content}
      POSTGRES_DB: ${POSTGRES_DB:-content}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-content}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - content_net

volumes:
  pg_data:

networks:
  content_net:
    driver: bridge
