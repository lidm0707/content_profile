name: content_profile

services:
  nginx:
    image: nginx:alpine
    ports:
      - "6190:6190"
    environment:
      # Passed raw; the entrypoint strips the scheme into SUPABASE_HOST for
      # the nginx config template (compose can't do shell substitutions).
      SUPABASE_URL: ${SUPABASE_URL}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/entrypoint.sh:/docker-entrypoint.d/30-resolve-supabase-host.sh:ro
    depends_on:
      - content_ui
    networks:
      - content_net

  content_ui:
    build:
      context: ..
      dockerfile: docker/ui.Dockerfile
      args:
        APP_MODE: production
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
        GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID}
    expose:
      - "80"
    networks:
      - content_net

networks:
  content_net:
    driver: bridge
