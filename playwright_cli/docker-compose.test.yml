services:
  playwright:
    build: .
    container_name: content_profile_playwright
    environment:
      APP_URL: ${APP_URL:-http://nginx:80}
    networks:
      - content_net
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results

networks:
  content_net:
    external: true
    name: content_profile_backend_content_net
